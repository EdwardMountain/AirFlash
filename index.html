  AirFlash — Bluetooth firmware updater for Telink-based devices
  by DoDo7 · MIT License (see LICENSE) · No warranty: flashing the wrong firmware can brick a device.

  WHAT IT IS
    A single self-contained HTML file. No build step, no dependencies, no network requests
    (fonts are embedded). It uses the Web Bluetooth API, so it runs in Chrome/Edge on
    Windows, macOS, Linux and Android. Not Safari/Firefox/iOS (no Web Bluetooth there).

  STRUCTURE OF THIS FILE
    1. <style>   embedded fonts, design tokens (light/dark), layout
    2. markup    header (language flags), left rail (firmware + settings), device flows, log
    3. <script>  i18n table → helpers → protocol (CRC, packets) → firmware analysis →
                 settings → Web Bluetooth support check → Flow class (one per device) → language

  PROTOCOL (Telink BLE OTA, same as the Android app "OTA_Telink")
    Service        00010203-0405-0607-0809-0a0b0c0d1912
    Characteristic 00010203-0405-0607-0809-0a0b0c0d2b12  (read, write-without-response, optional notify)
    Sequence       FF00 prepare → FF01 start → data packets → FF02 end → device verifies and reboots
    Data packet    20 bytes: index (u16 LE) + 16 bytes of firmware (padded 0xFF) + CRC-16/MODBUS (u16 LE)
    End command    8 bytes:  02 FF + last index (u16 LE) + ~last index (u16 LE) + CRC-16/MODBUS over the 6 bytes
    Flow control   one characteristic read every N packets (N = "speed" of the official app, default 8)
    Result         newer firmware notifies FF06 + result code; classic firmware gives no result
    Timing         the device limits the total duration of an update: keep the pause at 0 ms

  FIRMWARE FILE CHECKS (before anything is sent)
    "KNLT" signature at offset 8 · size field at 0x18 must equal file size ·
    CRC32 (init 0xFFFFFFFF, no final XOR) over [0, size-4) must equal the last 4 bytes ·
    embedded device names (BRAND_MODEL strings) are compared with the connected device's name

/* Layout: desktop = one 16:9/16:10 screen, no page scroll: header band, left rail (firmware + settings), right field (device flows), log strip at the bottom. Phone = single column, page scrolls. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel2:#f6f8fa; --fg:#15202b; --muted:#5b6b7a; --line:#d8dee5; --line2:#e7ebf0;
  --accent:#1f5fbf; --accent-fg:#ffffff; --accent-soft:#e6eefb;
  --ok:#157a4a; --ok-bg:#dff3e8; --warn:#9a5b00; --warn-bg:#fdf0d8; --bad:#b42318; --bad-bg:#fbe3e0;
  --sans:"AF Sans",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans","Noto Sans CJK SC","Malgun Gothic",sans-serif; --mono:"AF Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 14px rgba(21,32,43,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1419; --panel:#171d24; --panel2:#1d242c; --fg:#e7ecf1; --muted:#95a3b1; --line:#2b343e; --line2:#232b34;
  --accent:#6ea2ff; --accent-fg:#0b1526; --accent-soft:#1a2639;
  --ok:#5fd397; --ok-bg:#143126; --warn:#f0b65a; --warn-bg:#352813; --bad:#ff8a80; --bad-bg:#3b1d1a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1419; --panel:#171d24; --panel2:#1d242c; --fg:#e7ecf1; --muted:#95a3b1; --line:#2b343e; --line2:#232b34;
  --accent:#6ea2ff; --accent-fg:#0b1526; --accent-soft:#1a2639;
  --ok:#5fd397; --ok-bg:#143126; --warn:#f0b65a; --warn-bg:#352813; --bad:#ff8a80; --bad-bg:#3b1d1a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
.flow>*,.panel>*,.fw>*{min-width:0}
.flow{overflow:hidden}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{display:grid;grid-template-rows:auto 1fr auto;gap:12px;height:100%;padding-block:12px;max-width:1600px;margin:0 auto;min-height:0}
h1,h2,h3,p{margin:0}
button{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;white-space:nowrap}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,.drop:focus-visible,.flag:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number],input[type=text],select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--fg);min-width:0}
input[type=number]{width:5.2em}
label.opt{display:flex;gap:8px;align-items:center;justify-content:space-between;color:var(--fg);font-size:13px}
label.opt span{color:var(--muted)}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:.15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(16px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mark svg{width:20px;height:20px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.spacer{flex:1}
.langs{display:flex;gap:2px;flex-wrap:wrap}
.flag{border:1px solid transparent;background:transparent;padding:3px 6px;border-radius:7px;font-size:17px;line-height:1;cursor:pointer}
.flag[aria-pressed="true"]{border-color:var(--line);background:var(--panel)}
.credit{color:var(--muted);font-size:12px;letter-spacing:.02em}

/* main */
main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;min-height:0}
.rail{display:grid;grid-template-rows:auto 1fr;gap:12px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:grid;gap:10px;min-width:0;min-height:0;align-content:start}
.panel.scroll{overflow:auto}
.ph{display:flex;align-items:center;gap:8px}
.ph h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ph .n{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.hint{color:var(--muted);font-size:12.5px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:16px 12px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px;background:var(--panel2)}
.drop strong{color:var(--fg);font-weight:600;display:block}
.drop.over{border-color:var(--accent);color:var(--accent)}
.drop input{display:none}
.fwlist{display:grid;gap:6px}
.fw{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);font-size:12.5px;align-items:center}
.fw .name{font-weight:600;word-break:break-all;min-width:0}
.fw .meta{grid-column:1/-1;color:var(--muted);font-family:var(--mono);font-size:11.5px;word-break:break-all}
.fw .err{grid-column:1/-1;color:var(--bad);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.idle{background:var(--panel2);color:var(--muted);border:1px solid var(--line2)}.pill.run{background:var(--accent-soft);color:var(--accent)}
.settings{display:grid;gap:9px}
.settings .sub{display:grid;gap:8px;padding:10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2)}
.preset{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:8px;background:var(--accent-soft)}
.preset b{font-weight:700}
.preset small{display:block;color:var(--muted);font-size:12px}

/* flows */
.field{display:grid;grid-template-rows:auto 1fr;gap:10px;min-height:0}
.fieldbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fieldbar h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.flows{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-content:start;overflow:auto;min-height:0;padding-right:2px}
.flow{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:grid;gap:9px;min-width:0;align-content:start}
.flow .top{display:flex;align-items:center;gap:8px}
.flow .top h3{font-size:14px;font-weight:700}
.flow .top .pill{margin-left:auto}
header>.pill{white-space:normal}
.flow .devname{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all;min-height:1.2em}
.flow .steps{display:flex;gap:4px;font-size:11.5px;color:var(--muted)}
.flow .steps span{flex:1;padding:4px 6px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .steps span.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.flow .steps span.done{color:var(--ok)}
.flow .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flow select{flex:1;min-width:0}
.flow .warn{font-size:12px;padding:7px 9px;border-radius:7px;background:var(--warn-bg);color:var(--warn)}
.flow .confirm{display:grid;gap:6px;padding:9px;border:1px solid var(--bad);border-radius:8px;font-size:12.5px}
progress{width:100%;height:8px;accent-color:var(--accent);border-radius:999px}
.stat{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.2em}
.empty{color:var(--muted);font-size:13px;padding:24px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r)}

/* log */
.logbar{display:grid;grid-template-rows:auto;gap:6px;min-height:0}
.logbar .ph{justify-content:space-between}
pre.log{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.5;height:112px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .e{color:var(--bad)}.log .w{color:var(--warn)}.log .g{color:var(--ok)}
.note{font-size:13px;padding:10px 12px;border-radius:8px;border-left:3px solid var(--bad);background:var(--bad-bg)}
.foot{color:var(--muted);font-size:11.5px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.foot a{color:inherit}
code{font-family:var(--mono);font-size:.92em}

@media (max-width:900px){
  html,body{height:auto}
  #app{height:auto;grid-template-rows:auto auto auto}
  main{grid-template-columns:1fr}
  .rail{grid-template-rows:auto auto}
  .flows{overflow:visible;grid-template-columns:1fr}
  pre.log{height:160px}
}
@media (prefers-reduced-motion:reduce){.switch i,.switch i::after{transition:none}}
</style>

</head>

}
const drop = $("drop");
$("fw-file").addEventListener("change", e => { loadFiles([...e.target.files]); e.target.value = ""; });

// ---------- settings ----------
const opts = () => ({

  readEvery: Math.min(64, Math.max(1, +$("opt-read").value || 8)), delay: Math.max(0, +$("opt-delay").value || 0),

$("opt-preset").addEventListener("change", e => applyPreset(e.target.checked));
["opt-namecheck", "opt-filter", "opt-all"].forEach(id => $(id).addEventListener("input", () => flows.forEach(f => f.render())));

// ---------- support ----------
let bleOk = true;
(function () {
  let k = "";
  if (!navigator.bluetooth) k = "noBle"; else if (window.self !== window.top) k = "iframe"; else if (!window.isSecureContext) k = "insecure";
  if (k) { bleOk = false; $("support").hidden = false; $("support").dataset.k = k; }
})();

// ---------- flows: one Flow instance per device card ----------

  }

    const fw = this.fw, n = this.device?.name || "";

    return fw.names.some(x => x === n || x.startsWith(n) || n.startsWith(x));
  }
  canFlash() {
    const fw = this.fw;

    const m = this.nameMatch();

  }
  render() {

    rm.addEventListener("click", () => this.remove()); top.appendChild(rm);
    r.appendChild(top);
    r.appendChild(el("div", "devname", this.device?.name || " "));
    const steps = el("div", "steps");

    r.appendChild(steps);
    r.appendChild(el("p", "hint", step === 1 ? t("hintFw") : step === 2 ? t(o.preset ? "hintConnectG" : "hintConnect") : step === 3 ? t("hintFlash") : t("hintDone")));
    // firmware select
    const row1 = el("div", "row");
    const sel = el("select"); sel.id = `fw-sel-${this.n}`;
    firmwares.filter(f => !f.errors.length).forEach(f => { const op = el("option", "", `${f.name} (${f.version})`); op.value = f.id; op.selected = fw && f.id === fw.id; sel.appendChild(op); });
    if (!sel.options.length) { const op = el("option", "", "—"); sel.appendChild(op); sel.disabled = true; }

    // buttons
    const row = el("div", "row");
    const b = (txt, cls, dis, fn) => { const x = el("button", cls, t(txt)); x.disabled = dis || !bleOk; x.addEventListener("click", fn); row.appendChild(x); return x; };
    if (!this.chr) b("connect", "primary", this.busy, () => this.connect());
    else { b("disconnect", "", this.busy, () => this.disconnect()); b("probe", "", this.busy, () => this.probe()); }
    b("flash", this.canFlash() ? "danger" : "", !this.canFlash(), () => this.askConfirm());
    r.appendChild(row);
    this.confirmBox = el("div", "confirm"); this.confirmBox.hidden = true; r.appendChild(this.confirmBox);
    this.prog = el("progress"); this.prog.max = 100; this.prog.value = 0; this.prog.hidden = true; r.appendChild(this.prog);
    this.stat = el("div", "stat", this.statText || ""); r.appendChild(this.stat);
    updateFlashAll();
  }
  remove() { if (this.device?.gatt?.connected) this.device.gatt.disconnect(); this.root.remove(); flows.splice(flows.indexOf(this), 1); renderEmpty(); updateFlashAll(); }
  setState(s) { this.state = s; this.render(); }
  async connect() {

  }
  onDisconnect() { this.device = null; this.chr = null; this.props = null; if (!this.busy) this.setState("disc"); }

    if (v.length >= 2 && v[1] === 0xFF && v[0] === 0x00) { log(t("lVer", { v: hex(v.subarray(2)) || "—" })); return; }

  }
  async write(bytes) {

    const row = el("div", "row");

    const c = el("button", "", t("cancel")); c.addEventListener("click", () => { this.confirmBox.hidden = true; });

}
function renderEmpty() {

  else if (e) e.remove();
}
function updateFlashAll() { $("btn-flash-all").disabled = !flows.some(f => f.canFlash()); }
$("btn-add").addEventListener("click", () => { flows.push(new Flow()); renderEmpty(); });
$("btn-flash-all").addEventListener("click", () => { flows.filter(f => f.canFlash()).forEach(f => f.askConfirm()); });
$("btn-clearlog").addEventListener("click", () => { logEl.textContent = ""; });
["opt-read", "opt-delay", "opt-resp"].forEach(id => $(id).addEventListener("input", () => { try { localStorage.setItem("airflash." + id, $(id).type === "checkbox" ? +$(id).checked : $(id).value); } catch {} }));
try { ["opt-read", "opt-delay"].forEach(id => { const v = localStorage.getItem("airflash." + id); if (v !== null) $(id).value = v; }); } catch {}

// ---------- language ----------

const langs = $("langs");
for (const [code, flag] of Object.entries(LANGS)) {
